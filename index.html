<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drag and Drop</title>
  <!--link icons library-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/style.css">

</head>

<body>
<div class="new-task-container">
    <button class="collapsible">Create new task</button>
    <div class="content">
      <form class="task-form">
        <input type="text" placeholder="Task title" name="title" id="title" />
        <div class="numbers-zone">
          <input type="number" placeholder="Hours approx" name="hours" id="hours" min="1" max="24"/>
          <input type="number" placeholder="Minutes approx" name="minutes" id="minutes" min="1" max="60"/>
          <input type="number" placeholder="Difficulty" name="difficulty" id="difficulty" min="1" max="5" />
        </div>
        <input type="text" placeholder="Notes" name="notes" id="notes" />
        <button type="submit">Submit</button>
      </form>
  </div>
</div>
<div class="main-container">
  <div class="column-headers">
    <h2>To-Do</h2>
    <h2>In Progress</h2>
    <h2>Done</h2>
  </div>
  <div class="columns">
    <div class="dropzone" id="to-do">

    </div>

    <div class="dropzone" id="in-progress">

    </div>

    <div class="dropzone" id="done">

    </div>
  </div>
  <div class="info-container">

  </div>

</div>
<script src="/index.js"></script>
</body>

</html>
